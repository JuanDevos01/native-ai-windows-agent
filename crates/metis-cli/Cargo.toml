[package]
name = "metis-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CLI binary for Metis"

[[bin]]
name = "metis"
path = "src/main.rs"

[features]
default = []
telegram = ["metis-channels/telegram"]
discord = ["metis-channels/discord"]
whatsapp = ["metis-channels/whatsapp"]
slack = ["metis-channels/slack"]
email = ["metis-channels/email"]

[dependencies]
async-trait = { workspace = true }
# Pinned so a crypto provider is always compiled in; see install_crypto_provider().
rustls = { version = "0.23", features = ["ring"] }
metis-core = { workspace = true }
metis-agent = { workspace = true }
metis-providers = { workspace = true }
metis-channels = { workspace = true }
metis-cron = { workspace = true }

tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
clap = { workspace = true }
rustyline = { workspace = true }
colored = { workspace = true }
dirs-next = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
rfd = { workspace = true }
# Paste screenshots from the clipboard into the chat
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
png = "0.18"
cron = "0.15"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Ctrl+V with only an image on the clipboard produces no egui event; read the key directly.
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }
